<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
	<meta charset="UTF-8">
	<!-- Viewport -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

	<!-- Primary Meta Tags -->
	<title>Monk Management System</title>
	<meta name="title" content="Monk Management System">
	<meta name="description"
		content="Monk Management System is a modern educational management platform connecting teachers, students, and administrators for a seamless learning experience.">
	<meta name="keywords" content="education, learning, tnak, student portal, teacher portal">

	<!-- Canonical Link -->
	<link rel="canonical" href="https://neakavorn.com">

	<!-- Performance Optimization -->
	<link rel="preconnect" href="https://neakavorn.work.gd" crossorigin>
	<link rel="dns-prefetch" href="https://neakavorn.work.gd">

	<!-- Favicon -->
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">

	<!-- Web App Meta -->
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<link rel="apple-touch-icon" href="/app-logo.png">

	<!-- Windows Tiles -->
	<meta name="msapplication-TileColor" content="#ffffff">
	<meta name="msapplication-TileImage" content="/app-logo.png">
	<meta name="theme-color" content="#ffffff">

	<!-- ============================================================
	     SECURITY HEADERS
	     NOTE: These meta-tag equivalents are best-effort only.
	     For full protection, configure these as HTTP response headers
	     on your server/CDN (nginx, Firebase Hosting, Cloudflare, etc.)
	     ============================================================ -->

	<!-- Content Security Policy: restricts what resources the browser can load -->
	<meta http-equiv="Content-Security-Policy"
		content="
			default-src 'self';
			script-src 'self' 'unsafe-inline' 'unsafe-eval';
			style-src 'self' 'unsafe-inline';
			connect-src 'self' https://neakavorn.work.gd wss://neakavorn.work.gd http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*;
			img-src 'self' data: blob: https://neakavorn.work.gd;
			font-src 'self' data:;
			frame-src 'none';
			base-uri 'self';
			form-action 'self';
			object-src 'none';
		">

	<!-- Prevents browsers from MIME-sniffing away from the declared content type -->
	<meta http-equiv="X-Content-Type-Options" content="nosniff">
</head>

<body>
	<noscript>
		<strong>We're sorry but Monk Management System doesn't work properly without JavaScript enabled. Please enable
			it to
			continue.</strong>
	</noscript>
	<div id="app"></div>
	<script type="module" src="/src/main.js"></script>
</body>

</html>
